name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: "set up hugo"
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
      - name: "build"
        run: hugo --minify -e production
      - name: "upload artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "deploy page"
        uses: actions/deploy-pages@v4
