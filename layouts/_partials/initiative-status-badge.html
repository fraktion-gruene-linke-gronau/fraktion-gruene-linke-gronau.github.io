{{- $status := . -}}
{{- $labels := dict
-}}
{{- $icons := dict
  "eingereicht" "inbox"
  "vertagt" "hourglass_top"
  "verwiesen" "hourglass_top"
  "angenommen" "check"
  "abgelehnt" "cancel"
-}}
<span class="initiative-status-badge initiative-status-badge--{{ $status }}">
  <span class="material-symbols-outlined" aria-hidden="true">
    {{ index $icons $status | default "help" }}
  </span>
  {{ index $labels $status | default ($status | humanize) }}
</span>
