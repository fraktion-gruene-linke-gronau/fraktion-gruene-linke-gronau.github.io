{{- $status := . -}}
{{- $icons := dict
  "eingereicht" "inbox"
  "vertagt" "hourglass_top"
  "verwiesen" "hourglass_top"
  "angenommen" "check"
  "abgelehnt" "cancel"
  "beantwortet" "check_circle"
-}}
<span class="badge initiative-status-badge initiative-status-badge--{{ $status }}">
  <span class="material-symbols-outlined" aria-hidden="true">
    {{ index $icons $status | default "help" }}
  </span>
  {{ $status | humanize }}
</span>
