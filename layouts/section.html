{{ define "main" }}
  <section class="listing-page prose-flow">
    <header class="listing-header prose-flow">
      <p class="eyebrow">{{ .Params.eyebrow }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="listing-intro prose">{{ . }}</div>{{ end }}
    </header>
    {{ if eq .Section "initiativen" }}
      {{ partial "initiative-grid.html" (dict
        "pages" .Pages
        "empty" "Noch keine Anträge oder Anfragen veröffentlicht."
      ) }}
    {{ else }}
    {{ end }}
  </section>
{{ end }}
