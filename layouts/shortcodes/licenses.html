<section class="license-overview" aria-label="Verwendete Schriftarten und Symbole">
  <article class="license-card">
    <span class="material-symbols-outlined license-card__icon" aria-hidden="true">font_download</span>
    <div>
      <h2>Google Material Symbols</h2>
      <p>Symbole der Benutzeroberfläche, lizenziert unter der Apache-Lizenz 2.0.</p>
    </div>
  </article>
  <article class="license-card">
    <span class="material-symbols-outlined license-card__icon" aria-hidden="true">text_fields</span>
    <div>
      <h2>Schriftarten</h2>
      <p>Carlito und Libre Baskerville, lizenziert unter der SIL Open Font License 1.1.</p>
    </div>
  </article>
</section>

<details class="license-details">
  <summary>Vollständige Lizenzhinweise anzeigen</summary>
  <pre class="license-details__text">{{ readFile "static/licenses.txt" }}</pre>
</details>
